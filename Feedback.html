<!DOCTYPE html>
<html>
<head>
    <title>Feedback Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feedback-box {
            width: 450px;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        h4 {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #1e3c72;
            outline: none;
        }

        .buttons {
            text-align: center;
            margin-top: 10px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 11px 25px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }

        input[type="submit"] {
            background-color: #1e3c72;
        }

        input[type="reset"] {
            background-color: #e74c3c;
        }

        input[type="submit"]:hover {
            background-color: #2a5298;
        }

        input[type="reset"]:hover {
            background-color: #c0392b;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .links a {
            text-decoration: none;
            color: #1e3c72;
            font-weight: bold;
            margin: 0 10px;
        }

        .links a:hover {
            color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="feedback-box">

        <h2>FEEDBACK</h2>

        <h4>Share Your Experience With Us</h4>

        <form>

            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Feedback:</label>
            <textarea name="feedback" rows="5"
                placeholder="Write your feedback here..." required></textarea>

            <div class="buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
            </div>

        </form>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="Registration.html">Registration</a>
        </div>

    </div>

</body>
</html>
