<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .forgot-box {
            width: 380px;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            color: #1e3c72;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        input[type="email"]:focus {
            border-color: #1e3c72;
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #1e3c72;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #2a5298;
        }

        .links {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .links a {
            text-decoration: none;
            color: #1e3c72;
            font-weight: bold;
        }

        .links a:hover {
            color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="forgot-box">

        <h2>Forgot Password?</h2>

        <p>
            Enter your email address and we will send you
            a link to reset your password.
        </p>

        <form>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <input type="submit" value="Send Reset Link">

        </form>

        <div class="links">
            <a href="Login.html">Back to Login</a>
            <br><br>
            <a href="index.html">Home</a>
        </div>

    </div>

</body>
</html>
