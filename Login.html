<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #1e3c72;
            outline: none;
        }

        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 11px 25px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }

        input[type="submit"] {
            background-color: #1e3c72;
        }

        input[type="reset"] {
            background-color: #e74c3c;
        }

        input[type="submit"]:hover {
            background-color: #2a5298;
        }

        input[type="reset"]:hover {
            background-color: #c0392b;
        }

        .links {
            text-align: center;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .links a {
            display: block;
            text-decoration: none;
            color: #1e3c72;
            margin: 10px;
            font-weight: bold;
        }

        .links a:hover {
            color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>LOGIN PAGE</h2>

        <form>

            <label>Username:</label>
            <input type="text" name="username" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <div class="buttons">
                <input type="submit" value="Login">
                <input type="reset" value="Reset">
            </div>

        </form>

        <div class="links">
            <a href="Index.html">Home</a>
            <a href="Forgot Password.html">Forgot Password</a>
        </div>

    </div>

</body>
</html>
